<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Drone GCS Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .tracking-highlight {
            border: 3px solid #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff0000;
        }

        .drone-icon {
            width: 36px;
            height: 36px;
            transform-origin: center center;
            filter: drop-shadow(0 0 6px rgba(255, 60, 60, 0.9));
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // =========================
        // 1. 지도 초기화
        // =========================
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([36.6912, 126.5828], 17);

        const MAPBOX_TOKEN = 'pk.eyJ1Ijoiam9zZzEyMyIsImEiOiJjbWxnNXAxeGMwOGY4M2RzYTR3bGMxd2ttIn0.PZhGAnWNXBMrp8-uCwYH0g';

        L.tileLayer(
            `https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`,
            {
                tileSize: 512,
                zoomOffset: -1,
                maxZoom: 22,
                maxNativeZoom: 20,
                attribution: '© Mapbox © OpenStreetMap'
            }
        ).addTo(map);


        // =========================
        // 2. 드론 마커
        // =========================
        function createDroneIcon(deg) {
            return L.divIcon({
                className: '',
                html: `
                        <div class="drone-icon" style="transform: rotate(${deg}deg);">
                            <svg width="36" height="36" viewBox="0 0 24 24">
                                <path d="M12 2 L19 20 L12 16 L5 20 Z"
                                      fill="#ff3b3b"
                                      stroke="white"
                                      stroke-width="1.2"/>
                            </svg>
                        </div>
                    `,
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            });
        }

        let droneHeadingDeg = 0;

        var droneMarker = L.marker(
            [36.6912, 126.5828],
            { icon: createDroneIcon(droneHeadingDeg) }
        ).addTo(map);

        function updateLocation(lat, lng, headingDeg) {
            const newLatLng = new L.LatLng(lat, lng);

            droneMarker.setLatLng(newLatLng);
            map.panTo(newLatLng);

            if (typeof headingDeg === 'number') {
                droneHeadingDeg = headingDeg;
                droneMarker.setIcon(createDroneIcon(droneHeadingDeg));
            }
        }


        // =========================
        // 3. 타겟 마커
        // =========================
        var targetMarkers = {};

        function updateTargetMarker(id, lat, lng, type, isSelected) {
            const color = isSelected ? "#EF4444" : "#FACC15";
            const radius = isSelected ? 9 : 7;

            if (targetMarkers[id]) {
                targetMarkers[id].setLatLng([lat, lng]);
                targetMarkers[id].setStyle({
                    color: color,
                    fillColor: color
                });
                targetMarkers[id].setRadius(radius);
                targetMarkers[id].bindTooltip(`ID:${id} ${type}`);
                return;
            }

            const marker = L.circleMarker([lat, lng], {
                radius: radius,
                color: color,
                fillColor: color,
                fillOpacity: 0.9,
                weight: 2
            }).addTo(map);

            marker.bindTooltip(`ID:${id} ${type}`);

            targetMarkers[id] = marker;
        }

        function selectTargetMarker(selectedId) {
            Object.keys(targetMarkers).forEach(id => {
                const isSelected = Number(id) === selectedId;
                const color = isSelected ? "#EF4444" : "#FACC15";
                const radius = isSelected ? 9 : 7;

                targetMarkers[id].setStyle({
                    color: color,
                    fillColor: color
                });

                targetMarkers[id].setRadius(radius);
            });
        }

        function removeTargetMarker(id) {
            if (!targetMarkers[id]) return;

            map.removeLayer(targetMarkers[id]);
            delete targetMarkers[id];
        }


        // =========================
        // 4. 이륙 지점 마커
        // =========================
        function addTakeoffMarker(lat, lng) {
            if (window.takeoffMarker) {
                map.removeLayer(window.takeoffMarker);
            }

            var takeoffIcon = L.divIcon({
                html: `
                        <div style="
                            background: #27ae60;
                            color: white;
                            border-radius: 15px;
                            padding: 4px 10px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-weight: bold;
                            font-size: 12px;
                            border: 2px solid white;
                            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
                            white-space: nowrap;
                        ">Takeoff</div>
                    `,
                className: '',
                iconSize: [25, 25],
                iconAnchor: [12, 12]
            });

            window.takeoffMarker = L.marker([lat, lng], { icon: takeoffIcon })
                .addTo(map)
                .bindPopup("Takeoff Point");
        }


        // =========================
        // 5. 웨이포인트 관리
        // =========================
        var waypointMarkers = [];
        var missionPoints = [];
        var missionLine = L.polyline([], {
            color: '#e67e22',
            weight: 3,
            dashArray: '5, 10'
        }).addTo(map);

        map.on('click', function (e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            var wpNumber = waypointMarkers.length + 1;

            var wpIcon = L.divIcon({
                className: '',
                html: `
                        <div style="
                            background: #3498db;
                            color: white;
                            border-radius: 50%;
                            width: 20px;
                            height: 20px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 11px;
                            font-weight: bold;
                            border: 2px solid white;
                            box-shadow: 0 0 5px rgba(0,0,0,0.5);
                        ">${wpNumber}</div>
                    `,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            var marker = L.marker([lat, lng], { icon: wpIcon }).addTo(map);

            waypointMarkers.push(marker);
            missionPoints.push([lat, lng]);
            missionLine.setLatLngs(missionPoints);

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    tag: 'ADD_WAYPOINT',
                    lat: lat,
                    lng: lng
                });
            }
        });

        function undoLastWaypoint() {
            if (missionPoints.length > 0) {
                var lastMarker = waypointMarkers.pop();

                if (lastMarker) {
                    map.removeLayer(lastMarker);
                }

                missionPoints.pop();
                missionLine.setLatLngs(missionPoints);
            }
        }

        function clearAllWaypoints() {
            waypointMarkers.forEach(marker => map.removeLayer(marker));

            waypointMarkers = [];
            missionPoints = [];
            missionLine.setLatLngs([]);
        }


        // =========================
        // 6. 지도 전체 초기화
        // =========================
        function clearAllMapElements() {
            if (window.takeoffMarker) {
                map.removeLayer(window.takeoffMarker);
                window.takeoffMarker = null;
            }

            clearAllWaypoints();

            Object.values(targetMarkers).forEach(marker => map.removeLayer(marker));
            targetMarkers = {};

            if (historyPolyline) {
                map.removeLayer(historyPolyline);
                historyPolyline = null;
            }
        }


        // =========================
        // 7. 비행 궤적 표시
        // =========================
        let historyPolyline = null;

        function drawFlightPath(locations) {
            if (historyPolyline) {
                map.removeLayer(historyPolyline);
                historyPolyline = null;
            }

            if (!locations || locations.length === 0) {
                return;
            }

            historyPolyline = L.polyline(locations, {
                color: '#ff0000',
                weight: 3,
                opacity: 0.6,
                smoothFactor: 1
            }).addTo(map);

            if (locations.length > 1) {
                map.fitBounds(historyPolyline.getBounds(), {
                    padding: [20, 20]
                });
            }
        }
    </script>
</body>
</html>
